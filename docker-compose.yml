name: cutly

# Only the infrastructure runs in Docker; the project itself runs on the host
# with `python main.py` (bot + Celery worker + beat), as in couplyo.
#
#   docker compose up -d
#
# Ports are fixed and published on localhost only. The usual ones (5432, 6379…)
# are already taken on the development machine, so these are deliberately
# different. They must match DB_URL / REDIS_*_URL in .env (.env.example has them).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cutly
      POSTGRES_USER: cutly
      POSTGRES_PASSWORD: cutly
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cutly", "-d", "cutly"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Disposable entity cache: no persistence, evicts least-recently-used keys.
  redis-cache:
    image: redis:7.4-alpine
    command: redis-server --save '' --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Conversations, upload sessions and the Celery queue: persisted, never evicted.
  redis-state:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:26380:6379"
    volumes:
      - redis-state-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres-data:
  redis-state-data:
