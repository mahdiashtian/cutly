[project]
name = "cutly"
version = "3.0.0"
description = "Telegram file storage and sharing bot (Telethon, SQLAlchemy, Redis, Celery)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["bot", "core", "db", "repositories", "schemas", "services", "worker", "container"]
